[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "odap-evidence-integrations"
version = "0.1.0"
description = "Local ODAP evidence verification tools for agent frameworks"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
fastmcp = ["fastmcp==4.2.0"]
langchain = ["langchain-core==1.8.0"]
langgraph = ["langchain-core==1.8.0", "langgraph==1.2.22"]
llamaindex = ["llama-index-core==0.14.26"]

[tool.setuptools.packages.find]
where = ["src"]
