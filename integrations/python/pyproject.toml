[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "odap-evidence-integrations"
version = "0.2.0"
description = "Pinned ODAP evidence tools for agent frameworks, catalogs and telemetry"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
fastmcp = ["fastmcp==4.2.0"]
langchain = ["langchain-core==1.8.0"]
langgraph = ["langchain-core==1.8.0", "langgraph==1.2.22"]
llamaindex = ["llama-index-core==0.14.26"]
datahub = ["acryl-datahub==1.7.0.20"]
openmetadata = ["openmetadata-ingestion==2.0.8.0"]
opentelemetry = ["opentelemetry-sdk==1.45.2"]

[tool.setuptools.packages.find]
where = ["src"]
