name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/gateway-verified-*'

jobs:
  postgresql-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.12@sha256:6f7593c161689b6b02c78668b314af7da8811b592c5519108c57a49d0b6ad788
        env:
          POSTGRES_DB: odap_pg_fixture
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d odap_pg_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Configure isolated PostgreSQL TLS
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          mkdir -p .tmp/postgresql-tls
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=odap-synthetic-postgresql' -addext 'subjectAltName=IP:127.0.0.1' -keyout .tmp/postgresql-tls/server.key -out .tmp/postgresql-tls/server.crt 2>/dev/null
          docker cp .tmp/postgresql-tls/server.crt "$PG_CONTAINER:/var/lib/postgresql/data/server.crt"
          docker cp .tmp/postgresql-tls/server.key "$PG_CONTAINER:/var/lib/postgresql/data/server.key"
          docker exec "$PG_CONTAINER" chown postgres:postgres /var/lib/postgresql/data/server.key /var/lib/postgresql/data/server.crt
          docker exec "$PG_CONTAINER" chmod 0600 /var/lib/postgresql/data/server.key
          docker exec -u postgres "$PG_CONTAINER" psql -d odap_pg_fixture -c "ALTER SYSTEM SET ssl = 'on'"
          docker exec -u postgres "$PG_CONTAINER" psql -d odap_pg_fixture -c 'SELECT pg_reload_conf()'
      - name: Verify PostgreSQL connector
        env:
          ODAP_POSTGRES_FIXTURE: isolated-synthetic-only
          NODE_OPTIONS: --dns-result-order=ipv4first
        run: npm run test:postgresql
      - name: Preserve PostgreSQL results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgresql-integration-results
          path: |
            postgresql-results.json
            postgresql-environment.json
          if-no-files-found: error

  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build PostgreSQL host
        run: npm run postgresql:build

      - name: Test non-native suites
        run: npm run test -- --pool=forks --maxWorkers=2 --minWorkers=1 --exclude '**/*-miniflare.test.ts'

      - name: Complete native verification gate
        run: npm run test:native

      - name: Build
        run: npm run build

  python-integrations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: integrations/python/requirements-test.lock

      - name: Build detached verifier
        run: |
          npm ci
          npm run evidence:build

      - name: Install integration dependencies
        run: |
          python -m pip install -r integrations/python/requirements-test.lock
          python -m pip install --no-deps ./integrations/python
          python -m pip check

      - name: Lint Python integrations
        run: python -m ruff check integrations/python/src integrations/python/tests

      - name: Typecheck Python integrations
        run: |
          python -m mypy --platform linux --ignore-missing-imports --follow-imports=silent --check-untyped-defs integrations/python/src
          python -m mypy --platform win32 --ignore-missing-imports --follow-imports=silent --check-untyped-defs integrations/python/src

      - name: Verify Python integrations
        run: python integrations/python/tests/run_tests.py --report integration-results.json

      - name: Preserve integration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-integration-results
          path: integration-results.json
          if-no-files-found: error

  catalog-integrations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: integrations/python/requirements-catalog-test.lock

      - name: Build detached exporter
        run: |
          npm ci
          npm run evidence:build

      - name: Install catalog SDK dependencies
        run: |
          python -m pip install -r integrations/python/requirements-catalog-test.lock
          python -m pip install --no-deps ./integrations/python
          python -m pip check

      - name: Lint catalog integrations
        run: python -m ruff check integrations/python/src integrations/python/catalog_tests

      - name: Typecheck catalog integrations
        run: |
          python -m mypy --platform linux --ignore-missing-imports --follow-imports=silent --check-untyped-defs integrations/python/src
          python -m mypy --platform win32 --ignore-missing-imports --follow-imports=silent --check-untyped-defs integrations/python/src

      - name: Verify catalog SDK integrations
        run: python integrations/python/catalog_tests/run_tests.py --report catalog-results.json

      - name: Preserve catalog results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-integration-results
          path: catalog-results.json
          if-no-files-found: error

