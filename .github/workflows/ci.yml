name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/gateway-verified-*'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test non-native suites
        run: npm run test -- --pool=forks --maxWorkers=2 --minWorkers=1 --exclude '**/*-miniflare.test.ts'

      - name: Complete native verification gate
        run: npm run test:native

      - name: Build
        run: npm run build

  python-integrations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: integrations/python/requirements-test.lock

      - name: Build detached verifier
        run: |
          npm ci
          npm run evidence:build

      - name: Install integration dependencies
        run: |
          python -m pip install -r integrations/python/requirements-test.lock
          python -m pip install --no-deps ./integrations/python
          python -m pip check

      - name: Lint Python integrations
        run: python -m ruff check integrations/python/src integrations/python/tests

      - name: Typecheck Python integrations
        run: |
          python -m mypy --platform linux --ignore-missing-imports --follow-imports=silent --check-untyped-defs integrations/python/src
          python -m mypy --platform win32 --ignore-missing-imports --follow-imports=silent --check-untyped-defs integrations/python/src

      - name: Verify Python integrations
        run: python integrations/python/tests/run_tests.py --report integration-results.json

      - name: Preserve integration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-integration-results
          path: integration-results.json
          if-no-files-found: error

  catalog-integrations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: integrations/python/requirements-catalog-test.lock

      - name: Build detached exporter
        run: |
          npm ci
          npm run evidence:build

      - name: Install catalog SDK dependencies
        run: |
          python -m pip install -r integrations/python/requirements-catalog-test.lock
          python -m pip install --no-deps ./integrations/python
          python -m pip check

      - name: Lint catalog integrations
        run: python -m ruff check integrations/python/src integrations/python/catalog_tests

      - name: Typecheck catalog integrations
        run: |
          python -m mypy --platform linux --ignore-missing-imports --follow-imports=silent --check-untyped-defs integrations/python/src
          python -m mypy --platform win32 --ignore-missing-imports --follow-imports=silent --check-untyped-defs integrations/python/src

      - name: Verify catalog SDK integrations
        run: python integrations/python/catalog_tests/run_tests.py --report catalog-results.json

      - name: Preserve catalog results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-integration-results
          path: catalog-results.json
          if-no-files-found: error

