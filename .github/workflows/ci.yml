name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/gateway-verified-*'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test non-native suites
        run: npm run test -- --pool=forks --maxWorkers=2 --minWorkers=1 --exclude '**/*-miniflare.test.ts'

      - name: Complete native verification gate
        run: npm run test:native

      - name: Build
        run: npm run build

